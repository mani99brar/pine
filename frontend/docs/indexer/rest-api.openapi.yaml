                      code: unauthorized
                      message: A valid bearer token is required
        "404":
          description: Unknown account or wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                not_found:
                  summary: Unknown account or wallet
                  value:
                    error:
                      code: not_found
                      message: No account for login octocat
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                rate_limited:
                  summary: Too many requests
                  value:
                    error:
                      code: rate_limited
                      message: Rate limit exceeded; retry after 30 s
