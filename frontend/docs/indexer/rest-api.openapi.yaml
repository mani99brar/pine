# Pine REST indexer API — OpenAPI 3.1 contract (generated by packages/data/scripts/openapi-spec.ts).
# Regenerate: pnpm --filter @pine/data openapi. Do not hand-edit examples; edit the generator.
openapi: 3.1.0
info:
  title: Pine REST indexer API
  version: 1.0.0
  summary: Indexed claim/market/oracle/evidence state plus off-chain drafts and accounts for the Pine frontends.
  description: |-
    Contract for the REST indexer the Pine frontends read when `NEXT_PUBLIC_PINE_DATA_SOURCE=rest` (base URL in `NEXT_PUBLIC_PINE_API_URL`).
    This repository does not implement the server; `@pine/data` RestDataProvider, RestDraftStore and RestAccountStore are the clients.

    Conventions:
    - Read-model envelopes are snake_case. Optional values may be `null` (clients treat null and absent the same).
    - Embedded documents are verbatim domain JSON (camelCase): `manifest` (hashed — never re-key it), policy `parameters`, and draft `source`/`spec`/`funding`/`publication`.
    - Timestamps are ISO-8601 UTC (`2026-10-10T18:00:00Z`). Amounts are decimal strings in human units. Prices are numbers in [0, 1].
    - Lists paginate with an opaque `cursor`; responses return `next_cursor` (absent/null on the last page).
    - Errors use `{ "error": { "code", "message" } }` where code is one of network, not_found, bad_response, unauthorized, rate_limited, unsupported.
    - Reads are public (CORS `*`). Draft and account endpoints require `Authorization: Bearer <token>` issued by the app server after GitHub sign-in.

    Language: YES means a counterexample was demonstrated; NO means no qualifying counterexample was submitted (not a statement that the code is correct). Prices are the market-implied chance a qualifying counterexample is accepted. Liquidity is not a bounty. Invalid is not a refund.

    Examples are generated from the @pine/data demo fixtures (timestamps are relative to generation time).
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://api.pine.example/v1
    description: Production (placeholder)
  - url: http://localhost:4000/v1
    description: Local indexer
tags:
  - name: claims
    description: Claims with market, oracle and evidence state
  - name: activity
    description: Transaction history and reconciliation
  - name: portfolio
    description: Positions and liquidity of an address
  - name: policies
    description: Versioned policy catalog
  - name: stats
    description: Platform counters
  - name: drafts
    description: Claim drafts and persisted publication progress (auth)
  - name: accounts
    description: GitHub-linked accounts, SIWE wallets and preferences (auth)
paths:
  /claims:
    get:
      operationId: listClaims
      tags:
        - claims
      summary: List claims
      parameters:
        - name: status
          in: query
          required: false
          description: Repeat to match any of several statuses (`?status=open&status=disputed`)
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ClaimStatus"
          style: form
          explode: true
        - name: outcome
          in: query
          required: false
          description: Resolved outcome
          schema:
            $ref: "#/components/schemas/Outcome"
        - name: policy_id
          in: query
          required: false
          description: Policy id
          schema:
            type: string
            example: BOT-001
        - name: family
          in: query
          required: false
          description: Policy family
          schema:
            $ref: "#/components/schemas/PolicyFamily"
        - name: repo
          in: query
          required: false
          description: owner/name, case-insensitive
          schema:
            type: string
            example: kleros/gateway-balancer-bot
        - name: creator
          in: query
          required: false
          description: Creator address, case-insensitive
          schema:
            $ref: "#/components/schemas/Address"
        - name: chain_id
          in: query
          required: false
          description: Chain id
          schema:
            type: integer
        - name: search
          in: query
          required: false
          description: Whitespace-separated terms; every term must match title, violation, requirement, repo, PR, policy or claim number
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: "Default newest. `deadline`: upcoming deadlines first (soonest), then past ones"
          schema:
            $ref: "#/components/schemas/ClaimSort"
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from `next_cursor`
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Page size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: A page of claims
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimPage"
              examples:
                claimPage:
                  $ref: "#/components/examples/claimPage"
        "400":
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                bad_response:
                  summary: Invalid query parameter
                  value:
                    error:
                      code: bad_response
                      message: limit must be between 1 and 100
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                rate_limited:
                  summary: Too many requests
                  value:
                    error:
                      code: rate_limited
                      message: Rate limit exceeded; retry after 30 s
  /claims/{id}:
    get:
      operationId: getClaim
      tags:
        - claims
      summary: Claim detail with manifest, market, oracle, evidence and timeline
      parameters:
        - name: id
          in: path
          required: true
          description: Pine claim id (pine-0042); `PINE-0042` and `42` are accepted
          schema:
            type: string
            example: pine-0009
      responses:
        "200":
          description: The claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimDetail"
              examples:
                flagship:
                  $ref: "#/components/examples/flagship"
                arbitration:
                  $ref: "#/components/examples/arbitration"
                publishing:
                  $ref: "#/components/examples/publishing"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                not_found:
                  summary: Not found
                  value:
                    error:
                      code: not_found
                      message: No claim with id pine-9999
  /markets/{chain_id}/{address}/claim:
    get:
      operationId: getClaimByMarket
      tags:
        - claims
      summary: Claim for a Seer market address
      parameters:
        - name: chain_id
          in: path
          required: true
          description: Chain id
          schema:
            type: integer
        - name: address
          in: path
          required: true
          description: Seer market address, case-insensitive
          schema:
            $ref: "#/components/schemas/Address"
      responses:
        "200":
          description: The claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimDetail"
              examples:
                flagship:
                  $ref: "#/components/examples/flagship"
        "404":
          description: No Pine claim for this market
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                not_found:
                  summary: No Pine claim for this market
                  value:
                    error:
                      code: not_found
                      message: No Pine claim for market 100:0x0000000000000000000000000000000000000001
  /claims/{id}/prices:
    get:
      operationId: getPriceHistory
      tags:
        - claims
      summary: Hourly price history
      parameters:
        - name: id
          in: path
          required: true
          description: Pine claim id (pine-0042); `PINE-0042` and `42` are accepted
          schema:
            type: string
            example: pine-0009
        - name: range
          in: query
          required: false
          description: Time range
          schema:
            type: string
            enum:
              - 24h
              - 7d
              - 30d
              - all
            default: 7d
      responses:
        "200":
          description: Price points
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceHistory"
              examples:
                prices:
                  $ref: "#/components/examples/prices"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                not_found:
                  summary: Not found
                  value:
                    error:
                      code: not_found
                      message: No claim with id pine-9999
  /claims/{id}/depth:
    get:
      operationId: getDepth
      tags:
        - claims
      summary: Executable depth around the mid price
      parameters:
        - name: id
          in: path
          required: true
          description: Pine claim id (pine-0042); `PINE-0042` and `42` are accepted
          schema:
            type: string
            example: pine-0009
        - name: outcome
          in: query
          required: true
          description: Outcome side
          schema:
            type: string
            enum:
              - yes
              - no
      responses:
        "200":
          description: Depth snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Depth"
              examples:
                depth:
                  $ref: "#/components/examples/depth"
        "404":
          description: Unknown claim, or the market has no liquidity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                not_found:
                  summary: Unknown claim, or the market has no liquidity
                  value:
                    error:
                      code: not_found
                      message: No liquidity for pine-0015
  /claims/{id}/evidence:
    get:
      operationId: listEvidence
      tags:
        - claims
      summary: Evidence submissions, oldest first (untrusted content)
      parameters:
        - name: id
          in: path
          required: true
          description: Pine claim id (pine-0042); `PINE-0042` and `42` are accepted
          schema:
            type: string
            example: pine-0009
      responses:
        "200":
          description: Evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceList"
              examples:
                evidence:
                  $ref: "#/components/examples/evidence"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                not_found:
                  summary: Not found
                  value:
                    error:
                      code: not_found
                      message: No claim with id pine-9999
  /activity:
    get:
      operationId: listActivity
      tags:
        - activity
      summary: Activity, newest first
      parameters:
        - name: claim_id
          in: query
          required: false
          description: Filter by claim
          schema:
            type: string
        - name: account
          in: query
          required: false
          description: Filter by actor address
          schema:
            $ref: "#/components/schemas/Address"
        - name: types
          in: query
          required: false
          description: Repeat for several types
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ActivityType"
          style: form
          explode: true
        - name: cursor
          in: query
          required: false
          description: Opaque cursor
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Page size
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 25
      responses:
        "200":
          description: A page of activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityPage"
              examples:
                activity:
                  $ref: "#/components/examples/activity"
        "400":
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                bad_response:
                  summary: Invalid query parameter
                  value:
                    error:
                      code: bad_response
                      message: limit must be between 1 and 200
  /portfolio/{address}:
    get:
      operationId: getPortfolio
      tags:
        - portfolio
      summary: Outcome positions, LP positions and totals of an address (empty for unknown addresses)
      parameters:
        - name: address
          in: path
          required: true
          description: Wallet address, case-insensitive
          schema:
            $ref: "#/components/schemas/Address"
      responses:
        "200":
          description: Portfolio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"
              examples:
                portfolio:
                  $ref: "#/components/examples/portfolio"
  /policies:
    get:
      operationId: listPolicies
      tags:
        - policies
      summary: Policy catalog
      responses:
        "200":
          description: Policies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyList"
              examples:
                policies:
                  $ref: "#/components/examples/policies"
  /policies/{id}:
    get:
      operationId: getPolicy
      tags:
        - policies
      summary: One policy version (latest when version is omitted)
      parameters:
        - name: id
          in: path
          required: true
          description: Policy id
          schema:
            type: string
            example: BOT-001
        - name: version
          in: query
          required: false
          description: Semver
          schema:
            type: string
            example: 0.1.0
      responses:
        "200":
          description: Policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
              examples:
                policy:
                  $ref: "#/components/examples/policy"
        "404":
          description: Unknown policy or version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                not_found:
                  summary: Unknown policy or version
                  value:
                    error:
                      code: not_found
                      message: No policy BOT-001@9.9.9
  /stats:
    get:
      operationId: getStats
      tags:
        - stats
      summary: Platform counters
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"
              examples:
                stats:
                  $ref: "#/components/examples/stats"
  /drafts:
    get:
      operationId: listDrafts
      tags:
        - drafts
      summary: Drafts of an owner, most recently updated first
      security:
        - bearerAuth: []
      parameters:
        - name: owner
          in: query
          required: true
          description: GitHub login or address
          schema:
            type: string
      responses:
        "200":
          description: Drafts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftList"
              examples:
                drafts:
                  $ref: "#/components/examples/drafts"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unauthorized:
                  summary: Missing or invalid bearer token
                  value:
                    error:
                      code: unauthorized
                      message: A valid bearer token is required
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                rate_limited:
                  summary: Too many requests
                  value:
                    error:
                      code: rate_limited
                      message: Rate limit exceeded; retry after 30 s
  /drafts/{id}:
    get:
      operationId: getDraft
      tags:
        - drafts
      summary: One draft
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Draft id
          schema:
            type: string
      responses:
        "200":
          description: Draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
              examples:
                draft:
                  $ref: "#/components/examples/draft"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unauthorized:
                  summary: Missing or invalid bearer token
                  value:
                    error:
                      code: unauthorized
                      message: A valid bearer token is required
        "404":
          description: Unknown draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                not_found:
                  summary: Unknown draft
                  value:
                    error:
                      code: not_found
                      message: No draft with id draft-missing
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                rate_limited:
                  summary: Too many requests
                  value:
                    error:
                      code: rate_limited
                      message: Rate limit exceeded; retry after 30 s
    put:
      operationId: saveDraft
      tags:
        - drafts
      summary: Create or replace a draft (the server sets updated_at)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Draft id
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Draft"
            examples:
              draft:
                $ref: "#/components/examples/draft"
      responses:
        "200":
          description: Saved draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
              examples:
                draft:
                  $ref: "#/components/examples/draft"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                bad_response:
                  summary: Invalid request body
                  value:
                    error:
                      code: bad_response
                      message: default_spending_limit must be a decimal string
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unauthorized:
                  summary: Missing or invalid bearer token
                  value:
                    error:
                      code: unauthorized
                      message: A valid bearer token is required
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                rate_limited:
                  summary: Too many requests
                  value:
                    error:
                      code: rate_limited
                      message: Rate limit exceeded; retry after 30 s
    delete:
      operationId: deleteDraft
      tags:
        - drafts
      summary: Delete a draft
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Draft id
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unauthorized:
                  summary: Missing or invalid bearer token
                  value:
                    error:
                      code: unauthorized
                      message: A valid bearer token is required
        "404":
          description: Unknown draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                not_found:
                  summary: Unknown draft
                  value:
                    error:
                      code: not_found
                      message: No draft with id draft-missing
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                rate_limited:
                  summary: Too many requests
                  value:
                    error:
                      code: rate_limited
                      message: Rate limit exceeded; retry after 30 s
  /accounts/{login}:
