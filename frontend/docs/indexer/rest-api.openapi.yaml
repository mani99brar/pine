  /accounts/{login}/wallets:
    post:
      operationId: linkWallet
      tags:
        - accounts
      summary: Link a SIWE-verified wallet (first wallet becomes primary)
      security:
        - bearerAuth: []
      parameters:
        - name: login
          in: path
          required: true
          description: GitHub login
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletLink"
            examples:
              wallet:
                $ref: "#/components/examples/wallet"
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
              examples:
                account:
                  $ref: "#/components/examples/account"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                bad_response:
                  summary: Invalid request body
                  value:
                    error:
                      code: bad_response
                      message: default_spending_limit must be a decimal string
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unauthorized:
                  summary: Missing or invalid bearer token
                  value:
                    error:
                      code: unauthorized
                      message: A valid bearer token is required
        "404":
          description: Unknown account or wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                not_found:
                  summary: Unknown account or wallet
                  value:
                    error:
                      code: not_found
                      message: No account for login octocat
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                rate_limited:
                  summary: Too many requests
                  value:
                    error:
                      code: rate_limited
                      message: Rate limit exceeded; retry after 30 s
  /accounts/{login}/wallets/{address}:
    delete:
      operationId: unlinkWallet
      tags:
        - accounts
      summary: Unlink a wallet (another wallet becomes primary if needed)
      security:
        - bearerAuth: []
      parameters:
        - name: login
          in: path
          required: true
          description: GitHub login
          schema:
            type: string
        - name: address
          in: path
          required: true
          description: Wallet address
          schema:
            $ref: "#/components/schemas/Address"
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
              examples:
                account:
                  $ref: "#/components/examples/account"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unauthorized:
                  summary: Missing or invalid bearer token
                  value:
                    error:
                      code: unauthorized
                      message: A valid bearer token is required
        "404":
          description: Unknown account or wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                not_found:
                  summary: Unknown account or wallet
                  value:
                    error:
                      code: not_found
                      message: No account for login octocat
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                rate_limited:
                  summary: Too many requests
                  value:
                    error:
                      code: rate_limited
                      message: Rate limit exceeded; retry after 30 s
