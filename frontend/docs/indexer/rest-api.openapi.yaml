              V shares doc D with U. U calls POST /v2/exports for D. V revokes the share while the job is queued. The worker runs after the revocation and GET /v2/exports/{jobId}/download returns D’s content to U.

              At the time content is returned, U has no active share, which the requirement covers explicitly.
