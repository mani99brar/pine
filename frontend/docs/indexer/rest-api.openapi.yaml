              sourceRequirement: gateway-balancer-bot-spec v0.4 §2.2, §4.2; §12 tests 3 and 7
              permittedStartingStates: "Any journal state reachable by running the keeper from genesis through the public planner API, including: a reporter below its funding threshold, no eligible bridging-fee funds, and protected arbitration funds and operator gas reserves present."
              reachability: Setup must use the keeper’s own planning/accounting code; fabricated journal rows are not admissible.
              accounts:
                - operator EOA (shared custody)
                - reporter EOA (Arbitrum)
              chains:
                - gnosis (100)
                - arbitrum (42161)
              routes:
                - gnosis→arbitrum reporter top-up via simulated bridge adapter
              accountingCategories:
                - arbitration allocation
                - bridging/reporter allocation
                - operator gas reserve
              faultModel:
                - process_crash
                - timeout
                - rpc_error
              simulatedAdapters:
