    policies:
      value:
        items:
          - id: FUNC-001
            family: FUNC
            version: 0.1.0
            title: Functional Correctness
            summary: Verify a specific feature requirement or a claimed bug fix in an application or library.
            status: enabled
            gate_reason: null
            content_hash: "0x0de6a45c215ce06ed1f3c83340450e6969344b6b36891a4c80e9578605977445"
            uri: ipfs://pending/FUNC-001@0.1.0
            text: |
              # FUNC-001@0.1.0 — Functional Correctness

              Status: v0.1 discovery drafts. Not approved market terms and not enabled in a deployed application.

              These templates define admissible technical counterexamples. They do not commission exhaustive reviews, promise payment to every evidence submitter, or override Seer's market-resolution rules.

              ## FUNC-001 — Functional Correctness

              ### Intended use

              Verify a specific feature requirement or a claimed bug fix in an application/library.

              Examples:

              - A user cannot access another user's private resource through named API operations.
              - A parser accepts/rejects a specified class of inputs according to a frozen format definition.
              - A stated bug fix eliminates an identified failure under defined conditions.

              ### Required parameters

              - Exact expected behavior, allowed input domain, and supported environment.
              - Relevant feature/API boundaries and configuration.
              - Whether any violation in the selected commit qualifies or only a regression introduced relative to the pinned base.

              ### Evidence

              A repeatable test/demonstration exercising the target code, reproduction command, fixtures without real customer data, actual output, and an explanation of the violated requirement.

              ### Exclusions

              - Style preferences, unbounded performance claims, and general code-quality judgments.
              - Unsupported environments or configurations outside the published scope.
              - An intentionally modified target implementation.
              - A screenshot or assertion without a reproducible behavioral failure.

              ### Outcome

              YES requires at least one timely qualifying functional counterexample. NO means none was submitted; it is not a general correctness certification.

              ## Common publication requirements

              Every published claim must freeze:

              - Policy ID, version, full text/content hash, and durable retrieval location.
              - Repository and commit; base commit when the requirement concerns an introduced regression.
              - In-scope components and one exact behavioral requirement/invariant.
              - Runtime, dependency versions, non-secret configuration, and relevant external-state snapshot.
              - Allowed inputs, operating assumptions, and fault model.
              - Evidence submission mechanism and absolute UTC deadline.
              - Reproduction requirements, exclusions, and treatment of unavailable/ambiguous evidence under applicable market rules.
              - Oracle opening/resolution parameters consistent with the evidence deadline.

              One family may contain many requirements, but publication selects a bounded proposition. A title such as "Smart-contract security" is not itself a resolvable claim.

              An admissible counterexample must be timely, identify the pinned artifact, and demonstrate the stated violation under the allowed conditions. A test that alters the target's behavior, assumes unavailable privileges, or depends on an excluded environment is not sufficient.

              A submission may be adjudicated after its timely filing. Technical validity is settled through the defined oracle/arbitration process, not by the customer silently changing requirements or rejecting inconvenient evidence.

              Only the market's native payout rules govern traders. Submitting evidence alone does not guarantee a bounty. Position ownership alone does not demonstrate that its holder performed research.

              ## Policy governance — proposed

              The initial application publishes a small reviewed catalog rather than accepting arbitrary user-written court policies. Customers parameterize a template and approve the resulting question before funding.

              Policy revisions affect only future markets. Existing markets retain their pinned text. UI labels, documentation updates, or administrator preferences must not retroactively change funded market terms.
            intended_use:
              - Verify a specific feature requirement or a claimed bug fix in an application/library.
            examples:
              - A user cannot access another user’s private resource through named API operations.
              - A parser accepts/rejects a specified class of inputs according to a frozen format definition.
              - A stated bug fix eliminates an identified failure under defined conditions.
            claim_classes:
              - id: access-boundary
                label: Access boundary on named operations
                description: A user cannot access another user’s private resource through named API operations.
              - id: format-conformance
                label: Input format conformance
                description: A parser accepts/rejects a specified class of inputs according to a frozen format definition.
              - id: bug-fix
                label: Claimed bug fix
                description: A stated bug fix eliminates an identified failure under defined conditions.
            parameters:
              - key: expectedBehavior
                label: Exact expected behavior
                help: The one behavior the pinned commit must exhibit, stated precisely enough that a failing test settles it.
                kind: longtext
                required: true
                maxLength: 2000
                placeholder: GET /v1/files/:id returns 404 unless the caller owns the file or it is shared with them.
                example: GET /v1/files/:id and GET /v1/files/:id/download return 404 for any caller who is neither the owner nor an explicit share recipient.
              - key: inputDomain
                label: Allowed input domain
                help: Which inputs a counterexample may use. Inputs outside this domain do not qualify.
                kind: longtext
                required: true
                maxLength: 2000
                placeholder: Any authenticated session for a non-admin user; any file id.
                example: Any authenticated non-admin session; any file id; any combination of documented query parameters.
              - key: supportedEnvironment
                label: Supported environment
                help: Runtime, platform and versions the claim covers. Unsupported environments are excluded.
                kind: text
                required: true
                maxLength: 300
                placeholder: Node 22 on Linux x64, Postgres 16
                example: Node 22.14 on Linux x64 with Postgres 16, using the pinned lockfile.
              - key: featureBoundaries
                label: Feature / API boundaries
                help: The named operations, modules or entry points in scope. Anything else is out of scope.
                kind: list
                required: true
                placeholder: GET /v1/files/:id
                example:
                  - GET /v1/files/:id
                  - GET /v1/files/:id/download
                  - src/auth/acl.ts
              - key: configuration
                label: Relevant configuration
                help: Feature flags and non-secret settings that affect the behavior. Never include secrets; values are hashed into the environment pin.
                kind: longtext
                required: true
                maxLength: 2000
                placeholder: SHARING_ENABLED=true; default config otherwise
                example: SHARING_ENABLED=true, ACL_CACHE_TTL=0; all other settings default.
              - key: violationScope
                label: Which violations qualify
                help: Whether any violation in the selected commit qualifies, or only a regression introduced relative to the pinned base commit.
                kind: select
                required: true
                options:
                  - value: any
                    label: Any violation in the selected commit
                    help: Pre-existing failures also qualify.
                  - value: regression
                    label: Only regressions relative to the base commit
                    help: Requires a pinned base commit; the behavior must hold at base and fail at the selected commit.
                example: any
            evidence_requirements:
              - A repeatable test/demonstration exercising the target code.
              - The reproduction command.
              - Fixtures without real customer data.
              - Actual output.
              - An explanation of the violated requirement.
              - Submitted before the absolute UTC evidence deadline through the published evidence mechanism; the submission transaction’s block timestamp is the timeliness proof.
              - Identifies the pinned repository, commit, environment hash and policy version.
              - Durable, retrievable evidence reference (content URI with hash).
            exclusions:
              - Style preferences, unbounded performance claims, and general code-quality judgments.
              - Unsupported environments or configurations outside the published scope.
              - An intentionally modified target implementation.
              - A screenshot or assertion without a reproducible behavioral failure.
              - A test that alters the target’s behavior, assumes unavailable privileges, or depends on an excluded environment.
              - "Late submissions: discoveries after the deadline do not reopen a finalized market."
            outcome_rules:
              yes: YES requires at least one timely qualifying functional counterexample.
              no: NO means none was submitted; it is not a general correctness certification.
              invalid: 'Native invalid/unanswerable outcomes are handled by the underlying Seer and Reality.eth protocol rules, including their actual payout rules: on invalid, Yes and No tokens pay nothing and only Invalid-result tokens redeem. An invalid result is not a guaranteed refund. "Answered too soon" blocks resolution until the question is reopened.'
            published_at: 2026-08-01T00:00:00Z
            supersedes: null
