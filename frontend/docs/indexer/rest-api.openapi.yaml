components:
  schemas:
    Hex:
      type: string
      description: 0x-prefixed lowercase or checksummed hex
      pattern: ^0x[0-9a-fA-F]*$
    Address:
      type: string
      description: EVM address
      pattern: ^0x[0-9a-fA-F]{40}$
    Hash32:
      type: string
      description: 32-byte hash
      pattern: ^0x[0-9a-fA-F]{64}$
    IsoDate:
      type: string
      description: ISO-8601 UTC timestamp, e.g. 2026-10-10T18:00:00Z
      format: date-time
    Decimal:
      type: string
      description: Decimal string in human units (never wei, never float), e.g. "12.5"
      pattern: ^-?\d+(\.\d+)?$
    ClaimStatus:
      type: string
      description: Lifecycle phase
      enum:
        - draft
        - publishing
        - open
        - awaiting_answer
        - answer_proposed
        - disputed
        - arbitration
        - resolved
        - settled
        - failed
    Outcome:
      type: string
      description: yes = counterexample demonstrated; no = no qualifying counterexample submitted; invalid = resolved invalid (not a refund)
      enum:
        - yes
        - no
        - invalid
    RealityAnswer:
      type: string
      description: Decoded Reality.eth answer
      enum:
        - yes
        - no
        - invalid
        - too_soon
    PolicyFamily:
      type: string
      enum:
        - FUNC
        - BOT
        - SC
    ClaimSort:
      type: string
      enum:
        - newest
        - deadline
        - liquidity
        - volume
        - yes_price
        - activity
    ActivityType:
      type: string
      enum:
        - market_created
        - manifest_pinned
        - liquidity_added
        - liquidity_removed
        - split
        - merge
        - trade
        - evidence_submitted
        - answer_posted
        - arbitration_requested
        - ruling
        - finalized
        - redeemed
        - approval
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Maps to PineDataError codes
              enum:
                - network
                - not_found
                - bad_response
                - unauthorized
                - rate_limited
                - unsupported
            message:
              type: string
    ClaimSummary:
      type: object
      description: Claim read model for lists
      required:
        - id
        - number
        - title
        - violation
        - policy
        - source
        - status
        - created_at
        - evidence_deadline
        - chain_id
        - creator
        - liquidity
        - volume
        - collateral_symbol
        - evidence_count
        - traders
        - sponsored
        - tags
      properties:
        id:
          type: string
          description: Stable Pine claim id, e.g. pine-0042
        number:
          type: integer
          description: Displayed as PINE-0042
        title:
          type: string
        violation:
          type: string
          description: Violation phrase inserted in the market question
        policy:
          type: object
          required:
            - id
            - version
            - family
            - title
          properties:
            id:
              type: string
            version:
              type: string
            family:
              $ref: "#/components/schemas/PolicyFamily"
            title:
              type: string
        source:
          type: object
          required:
            - owner
            - repo
            - commit_sha
          properties:
            owner:
              type: string
            repo:
              type: string
            commit_sha:
              type: string
              description: 40-hex commit SHA
              pattern: ^[0-9a-f]{40}$
            pr_number:
              type:
                - integer
                - "null"
            pr_title:
              type:
                - string
                - "null"
        status:
          $ref: "#/components/schemas/ClaimStatus"
        outcome:
          anyOf:
            - $ref: "#/components/schemas/Outcome"
            - type: "null"
        created_at:
          $ref: "#/components/schemas/IsoDate"
        evidence_deadline:
          $ref: "#/components/schemas/IsoDate"
        chain_id:
          type: integer
        market_address:
          anyOf:
            - $ref: "#/components/schemas/Address"
            - type: "null"
        creator:
          $ref: "#/components/schemas/Address"
        creator_github:
          type:
            - string
            - "null"
        yes_price:
          type:
            - number
            - "null"
          description: Market-implied chance a qualifying counterexample is accepted (YES price), [0,1]. Not a probability of bugs.
          minimum: 0
          maximum: 1
        yes_price_24h_ago:
          type:
            - number
            - "null"
          minimum: 0
          maximum: 1
        liquidity:
          $ref: "#/components/schemas/Decimal"
        volume:
          $ref: "#/components/schemas/Decimal"
        collateral_symbol:
          type: string
        evidence_count:
          type: integer
        traders:
          type: integer
          description: Distinct traders; does not prove review depth
        sponsored:
          type: boolean
        tags:
          type: array
          items:
            type: string
    ClaimPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ClaimSummary"
        next_cursor:
          type:
            - string
            - "null"
          description: Opaque; pass back as `cursor`
        total:
          type:
            - integer
            - "null"
    ClaimManifest:
      type: object
      description: "The immutable published manifest, embedded verbatim (camelCase) because manifest_hash = keccak256(canonical JSON of this object). Full JSON Schema: docs/agents/claim-manifest.schema.json."
      required:
        - $schema
        - manifestVersion
        - claimId
        - createdAt
        - creator
        - source
        - policy
        - claim
        - question
        - disclaimers
      properties:
        $schema:
          type: string
        manifestVersion:
          type: string
          const: "1"
        claimId:
          type: string
        createdAt:
          $ref: "#/components/schemas/IsoDate"
        creator:
          $ref: "#/components/schemas/Address"
        source:
          type: object
        policy:
          type: object
        claim:
          type: object
        question:
          type: object
          required:
            - text
            - outcomes
            - hash
          properties:
            text:
              type: string
            outcomes:
              type: array
              items:
                type: string
            hash:
              $ref: "#/components/schemas/Hash32"
        disclaimers:
          type: array
          items:
            type: string
      additionalProperties: true
    OutcomeQuote:
      type: object
      required:
        - index
        - label
        - token
        - price
      properties:
        index:
          type: integer
        label:
          type: string
          description: '"Yes" | "No" | "Invalid result"'
        token:
          $ref: "#/components/schemas/Address"
        price:
          type: number
          minimum: 0
          maximum: 1
        change_24h:
          type:
            - number
            - "null"
    Pool:
      type: object
      required:
        - address
        - dex
        - outcome
        - tvl
        - fee_bps
      properties:
        address:
          $ref: "#/components/schemas/Address"
        dex:
          type: string
        outcome:
          type: string
          enum:
            - yes
            - no
        tvl:
          $ref: "#/components/schemas/Decimal"
        fee_bps:
          type: integer
    Market:
      type: object
      required:
        - chain_id
        - address
        - seer_url
        - condition_id
        - question_id
        - collateral
        - outcomes
        - pools
        - liquidity
        - volume_24h
        - volume_total
        - traders
        - open_interest
        - created_at
        - created_tx
      properties:
        chain_id:
          type: integer
        address:
          $ref: "#/components/schemas/Address"
        seer_url:
          type: string
          format: uri
        condition_id:
          $ref: "#/components/schemas/Hash32"
        question_id:
          $ref: "#/components/schemas/Hash32"
        collateral:
          type: object
          required:
            - address
            - symbol
            - decimals
          properties:
            address:
              $ref: "#/components/schemas/Address"
            symbol:
              type: string
            decimals:
              type: integer
            name:
              type:
                - string
                - "null"
        outcomes:
          type: array
          items:
            $ref: "#/components/schemas/OutcomeQuote"
        pools:
          type: array
          items:
            $ref: "#/components/schemas/Pool"
        liquidity:
          $ref: "#/components/schemas/Decimal"
        volume_24h:
          $ref: "#/components/schemas/Decimal"
        volume_total:
          $ref: "#/components/schemas/Decimal"
        traders:
          type: integer
        open_interest:
          $ref: "#/components/schemas/Decimal"
        created_at:
          $ref: "#/components/schemas/IsoDate"
        created_tx:
          $ref: "#/components/schemas/Hash32"
    OracleAnswer:
      type: object
      required:
        - answer
        - bond
        - answerer
        - at
        - tx_hash
      properties:
        answer:
          $ref: "#/components/schemas/RealityAnswer"
        bond:
          $ref: "#/components/schemas/Decimal"
        answerer:
          $ref: "#/components/schemas/Address"
        at:
          $ref: "#/components/schemas/IsoDate"
        tx_hash:
          $ref: "#/components/schemas/Hash32"
    Arbitration:
      type: object
      description: Kleros arbitration; for Gnosis markets it is requested and paid in ETH on Ethereum
      required:
        - requested
        - cost
        - status
      properties:
        requested:
          type: boolean
        requested_at:
          anyOf:
            - $ref: "#/components/schemas/IsoDate"
            - type: "null"
        requester:
          anyOf:
            - $ref: "#/components/schemas/Address"
            - type: "null"
        dispute_id:
          type:
            - string
            - "null"
        court:
          type:
            - string
            - "null"
        cost:
          $ref: "#/components/schemas/Decimal"
        status:
          type: string
          enum:
            - not_requested
            - pending
            - appeal_period
            - ruled
        ruling:
          anyOf:
            - $ref: "#/components/schemas/RealityAnswer"
            - type: "null"
        appeal_deadline:
          anyOf:
            - $ref: "#/components/schemas/IsoDate"
            - type: "null"
        kleros_url:
          type:
            - string
            - "null"
          format: uri
    Oracle:
      type: object
      required:
        - chain_id
        - reality_question_id
        - reality_url
        - template_id
        - opening_time
        - timeout_seconds
        - min_bond
        - bond_token
        - is_finalized
        - history
        - arbitration
      properties:
        chain_id:
          type: integer
        reality_question_id:
          $ref: "#/components/schemas/Hash32"
        reality_url:
          type: string
          format: uri
        template_id:
          type: integer
        opening_time:
          $ref: "#/components/schemas/IsoDate"
        timeout_seconds:
          type: integer
          description: 302400 (3.5 days) for the official Seer factory
        min_bond:
          $ref: "#/components/schemas/Decimal"
        bond_token:
          type: string
        current_answer:
          anyOf:
            - $ref: "#/components/schemas/RealityAnswer"
            - type: "null"
        current_bond:
          anyOf:
            - $ref: "#/components/schemas/Decimal"
            - type: "null"
        finalizes_at:
          anyOf:
            - $ref: "#/components/schemas/IsoDate"
            - type: "null"
        is_finalized:
          type: boolean
        final_answer:
          anyOf:
            - $ref: "#/components/schemas/RealityAnswer"
            - type: "null"
        history:
          type: array
          items:
            $ref: "#/components/schemas/OracleAnswer"
        arbitration:
          $ref: "#/components/schemas/Arbitration"
    Evidence:
      type: object
      required:
        - id
        - claim_id
        - kind
        - title
        - summary
        - submitter
        - submitted_at
        - block_number
        - tx_hash
        - chain_id
        - uri
        - content_hash
        - timely
        - attachments
      properties:
        id:
          type: string
        claim_id:
          type: string
        kind:
          type: string
          enum:
            - counterexample
            - rebuttal
            - clarification
            - commitment
        title:
          type: string
          description: UNTRUSTED user content — render as plain text
        summary:
          type: string
          description: UNTRUSTED user content — render as plain text or sanitized Markdown only
        submitter:
          $ref: "#/components/schemas/Address"
        submitted_at:
          $ref: "#/components/schemas/IsoDate"
        block_number:
          type: integer
        tx_hash:
          $ref: "#/components/schemas/Hash32"
        chain_id:
          type: integer
          description: "Chain of the submission transaction (1 for Gnosis markets: ERC-1497 on the Ethereum foreign proxy)"
        uri:
          type: string
        content_hash:
          $ref: "#/components/schemas/Hash32"
        timely:
          type: boolean
          description: Block timestamp <= evidence deadline
        reproduction:
          type:
            - object
            - "null"
          required:
            - command
            - environment
            - expected
            - actual
          properties:
            command:
              type: string
            environment:
              type: string
            expected:
              type: string
            actual:
              type: string
            steps:
              type:
                - array
                - "null"
              items:
                type: string
        attachments:
          type: array
          items:
            type: object
            required:
              - name
              - uri
              - mime
              - size
              - hash
            properties:
              name:
                type: string
              uri:
                type: string
              mime:
                type: string
              size:
                type: integer
              hash:
                $ref: "#/components/schemas/Hash32"
        commitment:
          type:
            - object
            - "null"
          required:
            - hash
            - revealed
          properties:
            hash:
              $ref: "#/components/schemas/Hash32"
            revealed:
              type: boolean
            revealed_at:
              anyOf:
                - $ref: "#/components/schemas/IsoDate"
                - type: "null"
    EvidenceList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Evidence"
    TimelineEvent:
      type: object
      required:
        - id
        - kind
        - at
        - title
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
            - drafted
            - manifest_pinned
            - market_created
            - liquidity_added
            - liquidity_removed
            - evidence_submitted
            - evidence_deadline
            - oracle_opened
            - answer_posted
            - answer_challenged
            - arbitration_requested
            - ruling
            - finalized
            - redeemed
        at:
          $ref: "#/components/schemas/IsoDate"
        title:
          type: string
        detail:
          type:
            - string
            - "null"
        actor:
          anyOf:
            - $ref: "#/components/schemas/Address"
            - type: "null"
        tx_hash:
          anyOf:
            - $ref: "#/components/schemas/Hash32"
            - type: "null"
        scheduled:
          type:
            - boolean
            - "null"
          description: true for future scheduled events
    PublicationStep:
      type: object
      required:
        - id
        - status
      properties:
        id:
          type: string
          enum:
            - upload_manifest
            - create_market
            - approve_collateral
            - split_position
            - add_liquidity_yes
            - add_liquidity_no
            - register_claim
        status:
          type: string
          enum:
            - idle
            - awaiting_signature
            - pending
            - confirmed
            - failed
            - skipped
        tx_hash:
          anyOf:
            - $ref: "#/components/schemas/Hash32"
            - type: "null"
        error:
          type:
            - string
            - "null"
        at:
          anyOf:
            - $ref: "#/components/schemas/IsoDate"
            - type: "null"
    ClaimDetail:
      allOf:
        - $ref: "#/components/schemas/ClaimSummary"
        - type: object
          required:
            - manifest
            - manifest_uri
            - manifest_hash
            - evidence
            - timeline
          properties:
            manifest:
              $ref: "#/components/schemas/ClaimManifest"
            manifest_uri:
              type: string
            manifest_hash:
              $ref: "#/components/schemas/Hash32"
            market:
              anyOf:
                - $ref: "#/components/schemas/Market"
                - type: "null"
            oracle:
              anyOf:
                - $ref: "#/components/schemas/Oracle"
                - type: "null"
            evidence:
              type: array
              items:
                $ref: "#/components/schemas/Evidence"
            timeline:
              type: array
              items:
                $ref: "#/components/schemas/TimelineEvent"
            publication:
              type:
                - object
                - "null"
              description: Present for publishing/failed claims
              required:
                - steps
                - resumable
              properties:
                steps:
                  type: array
                  items:
                    $ref: "#/components/schemas/PublicationStep"
                resumable:
                  type: boolean
                note:
                  type:
                    - string
                    - "null"
            funding:
              type:
                - object
                - "null"
              required:
                - liquidity
                - spending_limit
                - withdrawable
              properties:
                liquidity:
                  $ref: "#/components/schemas/Decimal"
                spending_limit:
                  $ref: "#/components/schemas/Decimal"
                withdrawable:
                  type: boolean
    PriceHistory:
      type: object
      required:
        - claim_id
        - range
        - points
      properties:
        claim_id:
          type: string
        range:
          type: string
          enum:
            - 24h
            - 7d
            - 30d
            - all
        points:
          type: array
          items:
            type: array
            prefixItems:
              - type: integer
                description: t, unix ms
              - type: number
                description: yes price
              - type: number
                description: no price
              - type:
                  - number
                  - "null"
                description: volume in collateral
