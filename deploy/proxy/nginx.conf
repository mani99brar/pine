# Edge proxy for Pine: upstreams and servers. Include from the http{} block AFTER nginx-http.conf, which defines the
# log format, the GeoIP2 lookup and the per-IP limit zones used here (deploy/README.md, section 5).
# Topology: ONE trusted hop (PINE_TRUST_PROXY_HOPS=1) in front of pine-api on loopback.
#   app.pine.example           web app (Next.js, pine-web) + API under /api, same origin (PINE_PUBLIC_ORIGIN = PINE_API_ORIGIN)
#   pine-usercontent.example   untrusted evidence downloads only, on ANOTHER registrable domain (PINE_USER_CONTENT_ORIGIN)
# Never expose 127.0.0.1:9464 (API metrics) or 127.0.0.1:9465 (indexer health/metrics) publicly.

upstream pine_api { server 127.0.0.1:3000; keepalive 32; }
upstream pine_content { server 127.0.0.1:3001; keepalive 16; }
upstream pine_web { server 127.0.0.1:3004; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name app.pine.example pine-usercontent.example;
    # Every server logs with pine_noquery (the default "combined" format would keep the query string).
    access_log /var/log/nginx/pine-redirect.log pine_noquery;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.pine.example;

    ssl_certificate     /etc/letsencrypt/live/app.pine.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.pine.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Request logs without query strings or cookies (format pine_noquery: nginx-http.conf).
    access_log /var/log/nginx/pine-app.log pine_noquery;

    client_max_body_size 600k;   # 256 KiB evidence uploads plus multipart overhead; JSON bodies are capped by the API

    # The web app (pine-web: the Next.js server of an independently released client). The regex location below wins
    # for /api/, health and the well-known document, so the web server never sees a backend path or its cookies' routes.
    location / {
        limit_req zone=pine_web burst=100 nodelay;
        proxy_pass http://pine_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 35s;
    }

    location ~ ^/(api/|healthz$|readyz$|\.well-known/pine\.json$) {
        limit_req zone=pine_api burst=40 nodelay;
        proxy_pass http://pine_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Exactly one hop: replace (never append to) any client-supplied chain.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # PINE_COMPLIANCE_COUNTRY_HEADER: always set by the proxy, so a client copy never reaches the API.
        proxy_set_header X-Pine-Country $pine_country;
        proxy_read_timeout 35s;
    }

    # Prometheus metrics stay on the private listener; this path is never routed.
    location = /metrics { return 404; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pine-usercontent.example;

    ssl_certificate     /etc/letsencrypt/live/pine-usercontent.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pine-usercontent.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log /var/log/nginx/pine-usercontent.log pine_noquery;

    # Only GET/HEAD of /c/<sha256>; cookies are neither forwarded nor returned.
    location ~ ^/c/0x[0-9a-fA-F]{64}$ {
        limit_except GET { deny all; }
        limit_req zone=pine_content burst=20 nodelay;
        limit_conn pine_content_conn 4;
        proxy_pass http://pine_content;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
        proxy_read_timeout 15s;
    }
    location / { return 404; }
}
