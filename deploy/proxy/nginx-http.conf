# http-context definitions of the Pine edge proxy (nginx >= 1.25 with the GeoIP2 module, e.g.
# libnginx-mod-http-geoip2). Include from the http{} block BEFORE nginx.conf, which uses them (deploy/README.md):
#   http {
#       include /etc/nginx/pine/nginx-http.conf;
#       include /etc/nginx/pine/nginx.conf;
#   }
# log_format, geoip2 and the *_zone directives are allowed only in the http context, never inside a server{} block.

# Request logs without query strings or cookies (OAuth codes and states travel in the callback query): $uri, never
# $request or $request_uri.
log_format pine_noquery '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

# Country of the client from the proxy's own GeoIP database; any client-supplied X-Pine-Country is overwritten in nginx.conf.
geoip2 /usr/share/GeoIP/GeoLite2-Country.mmdb {
    $pine_country default=XX country iso_code;
}

# Fleet-wide per-IP limits (the API's own flood guard is per process). The user-content server has NO in-app limit.
limit_req_zone $binary_remote_addr zone=pine_api:20m rate=20r/s;
limit_req_zone $binary_remote_addr zone=pine_content:20m rate=10r/s;
# Web app pages and their static assets (one page load fetches many /_next/static files).
limit_req_zone $binary_remote_addr zone=pine_web:20m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=pine_content_conn:10m;
